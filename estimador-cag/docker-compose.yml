services:
  api:
    build:
      context: .
      target: runtime
    image: estimador-cag:latest
    container_name: estimador-cag
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: .
      target: runtime
    image: estimador-cag:latest
    container_name: estimador-cag-ui
    env_file:
      - .env
    environment:
      # El frontend habla con la API por la red interna de Compose.
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command:
      [
        "streamlit",
        "run",
        "frontend/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    ports:
      - "${UI_PORT:-8501}:8501"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: estimador-cag:test
    env_file:
      - .env
