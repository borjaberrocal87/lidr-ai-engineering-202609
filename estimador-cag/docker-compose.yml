services:
  api:
    build:
      context: .
      target: runtime
    image: estimador-cag:latest
    container_name: estimador-cag
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: estimador-cag:test
    env_file:
      - .env
