[project]
name = "estimador-cag"
version = "0.1.0"
description = "API FastAPI de estimación de software con arquitectura CAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "BLE", "RUF"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true


