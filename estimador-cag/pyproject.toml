[project]
name = "estimador-cag"
version = "0.1.0"
description = "API FastAPI de estimación de software con arquitectura CAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "numpy>=1.26",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "redisvl>=0.3.0",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
    # Sesión 6 — ingesta de datos, persistencia y PII.
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=24.0",
    # Modelo español de spaCy para Presidio (NER). Se instala como wheel fija
    # para que dev, CI y Docker usen exactamente el mismo modelo.
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "fpdf2>=2.8.9",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Es una aplicación, no una librería: uv no debe construir/instalar el proyecto,
# solo sus dependencias. Sin esto, uv podría pedir estructura src-layout.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "BLE", "RUF"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/*" = ["S310", "S603", "S607"]
"app/ingestion/pii/pseudonymizer.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app", "frontend"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# redisvl no publica stubs (sin `py.typed`); tratamos sus símbolos como Any.
module = ["redisvl", "redisvl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Libs de Sesión 6 sin stubs completos.
module = [
    "pandas",
    "pandas.*",
    "pandera",
    "pandera.*",
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
    "faker",
    "spacy",
    "spacy.*",
]
ignore_missing_imports = true


