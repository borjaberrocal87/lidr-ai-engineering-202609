name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: estimador-cag

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (type-check)
        run: uv run mypy app frontend

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Run test suite inside the image
        run: docker compose --profile test run --rm -T test

      - name: Start API
        run: docker compose up -d api

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Servicio healthy tras ${attempt} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "El servicio no respondió a /health a tiempo"
          docker compose logs api
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
